            { id: 56, text: "현재 맡고 있는 역할을 어떻게 소개하고 싶으신가요?" }, { id: 57, text: "업무 중 가장 즐거운 순간은 언제인가요?" }, { id: 58, text: "일을 하면서 가장 많이 배우는 것은 무엇인가요?" }, { id: 59, text: "현재 직업을 선택하게 된 계기는 무엇인가요?" }, { id: 60, text: "사회생활을 처음 시작했을 때 어떤 느낌이었나요?" },
            { id: 61, text: "가장 기억에 남는 프로젝트는 무엇인가요?" }, { id: 62, text: "지금까지 가장 자랑스러운 성과는 무엇인가요?" }, { id: 63, text: "함께 일하고 싶은 사람은 어떤 사람인가요?" }, { id: 64, text: "함께 일하기 어렵다고 느끼는 사람은 어떤 사람인가요?" }, { id: 65, text: "현재 업무의 가장 큰 매력은 무엇인가요?" },
            { id: 66, text: "최근 가장 크게 성장했다고 느낀 경험은 무엇인가요?" }, { id: 67, text: "일을 할 때 가장 중요하게 생각하는 가치는 무엇인가요?" }, { id: 68, text: "실패를 통해 배운 가장 큰 교훈은 무엇인가요?" }, { id: 69, text: "상사나 웃어른에게 특별한 고마움을 느꼈던 경험은 무엇인가요?" }, { id: 70, text: "후배들에게 어떤 사람으로 기억되고 싶나요?" },
            { id: 71, text: "앞으로 더 키우고 싶은 역량은 무엇인가요?" }, { id: 72, text: "지금까지 받았던 피드백 중 가장 기억에 남는 것은 무엇인가요?" }, { id: 73, text: "현재 가장 도전적으로 느껴지는 과제는 무엇인가요?" }, { id: 74, text: "다시 직업을 선택한다면 어떤 선택을 하고 싶나요?" }, { id: 75, text: "자신의 커리어를 한 단어로 표현한다면 무엇인가요?" },

            { id: 81, text: "가장 존경하는 사람은 누구이며 그 이유는 무엇인가요?" }, { id: 82, text: "주변 사람들은 당신에게 어떤 역할을 기대한다고 생각하시나요?" }, { id: 83, text: "좋은 관계를 위해 가장 중요하다고 생각하는 것은 무엇인가요?" }, { id: 84, text: "평소에는 당연하게 여겼는데 돌아보니 감사한 것은 무엇인가요?" }, { id: 85, text: "최근 누군가로부터 받았던 도움 중 기억에 남는 것은 무엇인가요?" },
            { id: 86, text: "최근 누군가를 도왔던 경험은 무엇인가요?" }, { id: 87, text: "지금까지 들었던 조언 중 가장 기억에 남는 것은 무엇인가요?" }, { id: 88, text: "스트레스를 받을 때 자신의 모습은 어떻게 달라지나요?" }, { id: 89, text: "자신의 강점은 무엇이라고 생각하시나요?" }, { id: 90, text: "요즘 스스로에게 가장 해주고 싶은 말은 무엇인가요?" },
            { id: 91, text: "회사에서 새로운 기회가 주어진다면 어떤 일을 해보고 싶나요?" }, { id: 92, text: "경제적으로 충분히 자유로워진다면 무엇을 하고 싶나요?" }, { id: 93, text: "은퇴 후에는 어떤 삶을 살고 싶으신가요?" }, { id: 94, text: "앞으로 꼭 해보고 싶은 것은 무엇인가요?" }, { id: 95, text: "10년 뒤 어떤 모습으로 살고 싶으신가요?" },
            { id: 96, text: "올해 꼭 이루고 싶은 목표는 무엇인가요?" }, { id: 97, text: "인생에서 꼭 이루고 싶은 버킷리스트는 무엇인가요?" }, { id: 98, text: "1년 동안 자유롭게 쉴 수 있다면 무엇을 하며 보내고 싶나요?" }, { id: 99, text: "앞으로 배우고 싶은 것은 무엇인가요?" }, { id: 100, text: "어떤 상태가 되면 '내 인생이 잘 가고 있다'라고 느끼실 것 같나요?" }
        ];

        var stepIdx = 1;
        var currentRoundQuestions = [];
        var historicalPickedIds = [];
        var isSetFinished = false; 

        function startApp() {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            isSetFinished = false; 
            
            setTimeout(function() {
                buildQuestionSet();
            }, 50);
        }

        function goHome() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
            stepIdx = 1;
            isSetFinished = false;
        }

        function buildQuestionSet() {
            currentRoundQuestions = [];
            var slices = [
                [1, 8], [9, 16], [17, 24], [25, 32], [33, 40], [41, 48],
                [49, 56], [57, 64], [65, 73], [74, 82], [83, 91], [92, 100]
            ];

            for (var i = 0; i < slices.length; i++) {
                var min = slices[i][0];
                var max = slices[i][1];
                
                var pool = [];
                for (var j = 0; j < questions.length; j++) {
                    if (questions[j].id >= min && questions[j].id <= max) {
                        pool.push(questions[j]);
                    }
                }

                var freshPool = [];
                for (var k = 0; k < pool.length; k++) {
                    if (historicalPickedIds.indexOf(pool[k].id) === -1) {
                        freshPool.push(pool[k]);
                    }
                }
                
                if (freshPool.length === 0) {
                    // 이 구간의 질문을 모두 소진했으면, 이 구간 기록만 지우고 다시 섞기
                    for (var r = 0; r < pool.length; r++) {
                        var pos = historicalPickedIds.indexOf(pool[r].id);
                        if (pos !== -1) historicalPickedIds.splice(pos, 1);
                    }
                    freshPool = pool;
                }
                
                var selected = freshPool[Math.floor(Math.random() * freshPool.length)];
                currentRoundQuestions.push(selected);
            }

            stepIdx = 1;
            renderQuestionDisplay();
        }

        function handlePrev() {
            if (isSetFinished) return;
            if (stepIdx > 1) {
                stepIdx--;
                renderQuestionDisplay();
            }
        }

        function handleNext() {
            // 한 세트 정답 안내가 완료된 '다음 세트' 상태일 때 누르면 첫 화면(HOME)으로 이동
            if (isSetFinished) {
                // 다음 세트: 시작 화면으로 가지 않고 바로 새 세트의 1/12부터 시작
                isSetFinished = false;
                buildQuestionSet();
                return;
            }

            if (stepIdx < 12) {
                stepIdx++;
                renderQuestionDisplay();
            } else {
                for (var i = 0; i < currentRoundQuestions.length; i++) {
                    if (historicalPickedIds.indexOf(currentRoundQuestions[i].id) === -1) {
                        historicalPickedIds.push(currentRoundQuestions[i].id);
                    }
                }
                renderFinishScreen();
            }
        }

        function renderFinishScreen() {
            isSetFinished = true; 
            
            var txtBox = document.getElementById('question-content');
            var btnNext = document.getElementById('btn-next');
            var btnPrev = document.getElementById('btn-prev');
            var fillBar = document.getElementById('step-fill');
            var lblStep = document.getElementById('step-label');

            txtBox.innerText = "한 세트가 끝났습니다.\n많이 친해지셨나요?";
            lblStep.innerText = "완료!";
            fillBar.style.width = "100%";
            
            btnNext.innerText = "다음 세트";
            btnNext.disabled = false;
            btnPrev.disabled = true;
        }

        function renderQuestionDisplay() {
            var txtBox = document.getElementById('question-content');
            var lblStep = document.getElementById('step-label');
            var fillBar = document.getElementById('step-fill');
            var btnNext = document.getElementById('btn-next');
            var btnPrev = document.getElementById('btn-prev');

            btnNext.disabled = true;
            btnPrev.disabled = true;
            lblStep.innerText = stepIdx + "/12";
            fillBar.style.width = ((stepIdx / 12) * 100) + "%";

            if (stepIdx === 12) {
                btnNext.innerText = "다음";
            } else {
                btnNext.innerText = "다음 질문";
            }

            var targetText = currentRoundQuestions[stepIdx - 1].text;

            var msElapsed = 0;
            var loopInterval = setInterval(function() {
                var rand = Math.floor(Math.random() * questions.length);
                txtBox.innerText = questions[rand].text;
                msElapsed += 50;
                
                if (msElapsed >= 400) {
                    clearInterval(loopInterval);
                    txtBox.innerText = targetText;
                    btnNext.disabled = false;
                    btnPrev.disabled = (stepIdx === 1);
                }
            }, 50);
        }
    </script>

    <style>
        :root {
            --bg-color: #FFF3DD;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --accent-color: #FF6B6B;
            --secondary-color: #8E9EAB;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        #app-wrapper {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        #app-footer {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 10px;
            color: var(--secondary-color);
            z-index: 10;
            pointer-events: none;
            opacity: 0.7;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 24px 35px 24px; 
            box-sizing: border-box;
        }

        .hidden { display: none !important; }

        #home-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-img {
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .welcome-text {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 35px;
            letter-spacing: -0.5px;
        }

        .header { width: 100%; margin-bottom: 10px; }
        
        .progress-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .progress-label {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            font-family: 'Poppins', sans-serif;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background-color: rgba(0,0,0,0.05);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .question-display {
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 30px;
            box-shadow: var(--shadow);
            margin-top: 10px;
            margin-bottom: 25px;
            min-height: 0;
            font-size: 23px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: auto;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-prev {
            flex: 0 0 35%;
            background-color: #FFFFFF;
            color: var(--secondary-color);
            border: 2px solid var(--secondary-color);
            box-shadow: none;
        }

        .btn-prev:active { transform: scale(0.97); }
        .btn-prev:disabled { color: #ccc; border-color: #e5e5e5; cursor: not-allowed; }

        .nav-row .btn-main {
            flex: 1;
        }

        .btn-main {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.25);
        }

        .btn-main:active { transform: scale(0.97); }
        .btn-main:disabled { background-color: #ddd; box-shadow: none; cursor: not-allowed; }
